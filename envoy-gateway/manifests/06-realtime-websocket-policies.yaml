# A real-time app: long-lived WebSocket connections on /ws.
# Field names move between Envoy Gateway releases. Verify against your version, for example:
#   kubectl explain backendtrafficpolicy.spec.timeout.http
#   kubectl explain clienttrafficpolicy.spec
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notify-ws
  namespace: notify
spec:
  parentRefs:
    - {name: notify, sectionName: notify-https}
  hostnames: ["notify.int.corp"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /ws}
      timeouts:
        request: 0s            # a request timeout cuts a long-lived socket
        backendRequest: 0s
      backendRefs:
        - {name: notify-ws, port: 8080}
---
# Client side, attached to the app's Gateway (platform team owns this).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: notify-client
  namespace: notify
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: notify}
  tcpKeepalive:
    idleTime: 60s
    interval: 30s
    probes: 3
  timeout:
    http:
      idleTimeout: 1h
---
# Backend side, attached to the route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: notify-backend
  namespace: notify
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: notify-ws}
  loadBalancer:
    type: ConsistentHash         # default is LeastRequest. Hash when a room or session must stick.
    consistentHash:
      type: Header
      header: {name: x-room-id}
  timeout:
    http:
      streamIdleTimeout: 1h      # Envoy's default stream idle timeout is far shorter
  healthCheck:
    active:
      type: HTTP
      http: {path: /healthz}
      interval: 10s
      timeout: 1s
      unhealthyThreshold: 3
      healthyThreshold: 1
    passive:
      consecutive5XxErrors: 3
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  circuitBreaker:
    maxConnections: 20000        # Envoy's default per cluster is 1024
    maxPendingRequests: 5000
    maxParallelRequests: 5000

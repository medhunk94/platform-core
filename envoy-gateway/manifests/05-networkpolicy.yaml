# Default deny, then let only the Envoy proxy pods reach the app.
# Check the labels on your Envoy pods first:  kubectl -n envoy-gateway-system get pods --show-labels
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: orders
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-envoy-gateway
  namespace: orders
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: envoy}
      ports:
        - {protocol: TCP, port: 8080}
